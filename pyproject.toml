[project]
name = "sql-analytics-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "streamlit>=1.37",
    "plotly>=5.22",
    "pandas>=2.2",
    "faker>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
